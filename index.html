<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1613">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Placar de caixeta: marca os pontos de cada rodada direto no navegador do celular.">
<!-- ARTIFACT:START -->
<title>Placar de Caixeta</title>
<style>
  :root {
    --mesa: #0F1613;
    --mesa-alta: #17201C;
    --mesa-fundo: #0B110E;
    --linha: #27332D;
    --osso: #EDE7DA;
    --osso-fraco: #8E9A92;
    --copas: #CC4436;
    --copas-fundo: #35191A;
    --latao: #D9A441;
    --latao-fundo: #33280F;
    --raio: 14px;
    --serifa: Georgia, "Times New Roman", "Noto Serif", serif;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--mesa);
    color: var(--osso);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 132px;
  }

  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--latao); outline-offset: 2px; border-radius: 6px; }

  .quadro { max-width: 520px; margin: 0 auto; padding: 0 16px; }
  main.quadro { padding-top: 8px; }

  /* ---------- topo ---------- */
  .topo {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(var(--mesa) 78%, transparent);
    padding-top: env(safe-area-inset-top);
  }
  .topo-linha {
    display: flex; align-items: center; gap: 12px;
    min-height: 56px;
  }
  .marca {
    font-family: var(--serifa);
    font-size: 21px; letter-spacing: .01em;
    margin-right: auto;
  }
  .marca span {
    display: block;
    font-family: var(--ui); font-size: 10px; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--osso-fraco); margin-top: -2px;
  }
  .icone {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 20px; color: var(--osso-fraco);
    border: 1px solid var(--linha);
  }
  .icone:disabled { opacity: .3; }

  /* ---------- selo da rodada ---------- */
  .selo {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 0 14px;
    font-family: var(--serifa); font-size: 15px;
  }
  .naipe {
    width: 30px; height: 40px; border-radius: 5px;
    background: var(--osso); color: var(--mesa-fundo);
    display: grid; place-items: center; font-size: 18px;
    box-shadow: 0 2px 0 rgba(0,0,0,.35);
    flex: none;
  }
  .naipe.vermelho { color: var(--copas); }
  .selo em { font-style: normal; color: var(--osso-fraco); font-family: var(--ui); font-size: 13px; display: block; }

  /* ---------- carta do jogador ---------- */
  .lista { display: flex; flex-direction: column; gap: 10px; }

  .carta {
    background: var(--mesa-alta);
    border: 1px solid var(--linha);
    border-radius: var(--raio);
    padding: 12px 14px 12px;
  }
  .carta.fora, .carta.saiu { opacity: .5; }
  .carta.saiu .nome { text-decoration: line-through; text-decoration-color: var(--osso-fraco); }
  .carta.campea { border-color: var(--latao); box-shadow: 0 0 0 1px var(--latao) inset; }
  .carta.campea .pontos { color: var(--latao); }

  .cabeca { display: flex; align-items: baseline; gap: 12px; }
  .quem { flex: 1; min-width: 0; }
  .nome {
    font-family: var(--serifa); font-size: 19px;
    overflow-wrap: anywhere;
  }
  .carta.fora .nome { text-decoration: line-through; text-decoration-color: var(--copas); }
  .pontos {
    font-size: 34px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .pontos small {
    font-size: 10px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--osso-fraco);
    display: block; text-align: right; margin-top: 4px;
  }
  .pontos.mudou { animation: pulso .4s ease-out; }
  @keyframes pulso { from { transform: scale(1.22); color: var(--latao); } to { transform: scale(1); } }

  .etiqueta {
    display: inline-block; margin-top: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 99px;
  }
  .etiqueta.fora { background: var(--copas-fundo); color: var(--copas); }
  .etiqueta.saiu { background: #2C3A33; color: var(--osso-fraco); }
  .etiqueta.campea { background: var(--latao-fundo); color: var(--latao); }

  .vai {
    width: 100%; min-height: 58px; margin-top: 12px;
    border-radius: 10px; border: 1px solid var(--linha);
    color: var(--osso-fraco);
    font-size: 16px; font-weight: 700; line-height: 1.15;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .vai small {
    font-size: 11.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: .01em;
  }
  .vai[aria-pressed="true"] {
    background: var(--latao); color: #241B06; border-color: transparent;
  }
  .vai[aria-pressed="true"] small { color: #50400F; }

  /* ---------- faixa de campeão ---------- */
  .campeao {
    background: var(--latao-fundo);
    border: 1px solid var(--latao);
    border-radius: var(--raio);
    padding: 16px; margin-bottom: 14px; text-align: center;
  }
  .campeao b { font-family: var(--serifa); font-size: 22px; color: var(--latao); display: block; }
  .campeao span { font-size: 13px; color: var(--osso-fraco); }

  /* ---------- histórico ---------- */
  .historico { margin: 22px 0 8px; }
  .historico summary {
    list-style: none; cursor: pointer;
    font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--osso-fraco); padding: 10px 0;
  }
  .historico summary::-webkit-details-marker { display: none; }
  .historico summary::after { content: " ▾"; }
  .historico[open] summary::after { content: " ▴"; }
  .rodada {
    display: flex; gap: 10px; padding: 9px 0;
    border-top: 1px solid var(--linha);
    font-size: 13.5px;
  }
  .rodada b { font-family: var(--serifa); font-weight: 400; color: var(--osso-fraco); flex: none; width: 28px; }
  .rodada div { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .rodada i { font-style: normal; font-variant-numeric: tabular-nums; }
  .rodada i.perda { color: var(--copas); }
  .rodada i.zero { color: var(--latao); }

  /* ---------- rodapé fixo ---------- */
  .rodape {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: linear-gradient(transparent, var(--mesa-fundo) 34%);
    padding: 22px 0 calc(14px + env(safe-area-inset-bottom));
  }
  .rodape .quadro { display: flex; gap: 8px; }

  .principal {
    flex: 1; min-height: 54px; border-radius: 12px;
    background: var(--latao); color: #241B06;
    font-size: 16px; font-weight: 700;
  }
  .principal:disabled { background: var(--linha); color: var(--osso-fraco); }
  .secundario {
    min-height: 54px; padding: 0 16px; border-radius: 12px;
    border: 1px solid var(--linha); background: var(--mesa-alta);
    color: var(--osso); font-size: 14px; font-weight: 600;
  }
  .secundario:disabled { opacity: .35; }

  /* ---------- formulário / regras ---------- */
  .bloco { margin-bottom: 26px; }
  .rotulo {
    font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--osso-fraco); margin-bottom: 10px;
  }
  .ajuda { font-size: 13px; color: var(--osso-fraco); margin: -4px 0 12px; }

  .campo-nome { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type="text"], input[type="number"] {
    width: 100%; min-height: 50px; padding: 0 14px;
    background: var(--mesa-alta); border: 1px solid var(--linha);
    border-radius: 10px; color: var(--osso);
  }
  input[type="number"] { text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
  .remover { width: 50px; flex: none; border: 1px solid var(--linha); border-radius: 10px; color: var(--osso-fraco); font-size: 20px; }
  .adicionar { width: 100%; min-height: 50px; border: 1px dashed var(--linha); border-radius: 10px; color: var(--osso-fraco); font-weight: 600; }

  .regra {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-top: 1px solid var(--linha);
  }
  .regra p { margin: 0; flex: 1; font-size: 14.5px; }
  .regra p span { display: block; font-size: 12.5px; color: var(--osso-fraco); }
  .regra input { width: 84px; }

  /* ---------- folha de opções ---------- */
  .folha {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(6,10,8,.72);
    display: flex; align-items: flex-end;
  }
  .folha[hidden] { display: none; }
  .folha-corpo {
    width: 100%; max-height: 88vh; overflow-y: auto;
    background: var(--mesa); border-radius: 18px 18px 0 0;
    border-top: 1px solid var(--linha);
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    animation: sobe .22s ease-out;
  }
  @keyframes sobe { from { transform: translateY(24px); } to { transform: none; } }
  .folha-corpo > .quadro { padding: 0; }
  .opcao {
    display: block; width: 100%; text-align: left;
    min-height: 52px; padding: 8px 0;
    border-top: 1px solid var(--linha);
    font-size: 15.5px;
  }
  .opcao.perigo { color: var(--copas); }
  .ajuste { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linha); }
  .ajuste span { flex: 1; font-family: var(--serifa); font-size: 17px; overflow-wrap: anywhere; }
  .ajuste b { width: 46px; text-align: center; font-size: 20px; font-variant-numeric: tabular-nums; }
  .passo { width: 46px; height: 46px; border: 1px solid var(--linha); border-radius: 10px; font-size: 20px; flex: none; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

</head>
<body>

<div class="topo">
  <div class="quadro topo-linha">
    <div class="marca">Caixeta<span>Placar</span></div>
    <button class="icone" id="btDesfazer" title="Desfazer última rodada" aria-label="Desfazer última rodada">↶</button>
    <button class="icone" id="btMenu" title="Opções" aria-label="Opções">⋯</button>
  </div>
</div>

<main class="quadro" id="tela"></main>

<div class="rodape" id="rodape" hidden>
  <div class="quadro">
    <button class="principal" id="btPrincipal">Salvar rodada</button>
  </div>
</div>

<div class="folha" id="folha" hidden>
  <div class="folha-corpo" id="folhaCorpo"></div>
</div>

<script>
(function () {
  "use strict";

  // o navegador guarda o placar por endereço: quem abrir com "www" teria um placar
  // separado e acharia que a partida sumiu. Endereço único, placar único.
  if (location.hostname === "www.caixeta.win") {
    location.replace("https://caixeta.win" + location.pathname + location.search + location.hash);
    return;
  }

  var CHAVE = "caixeta.placar.v1";
  var NAIPES = ["♠", "♥", "♦", "♣"];
  var TIPOS = [
    { chave: "naoFoi",    curto: "Não foi",      longo: "Pontos que perde quem fica de fora" },
    { chave: "ganhou",    curto: "Ganhou",       longo: "Pontos que perde quem ganha (normal: 0)" },
    { chave: "foiPerdeu", curto: "Foi e perdeu", longo: "Pontos que perde quem vai e perde" }
  ];

  var tela = document.getElementById("tela");
  var rodape = document.getElementById("rodape");
  var btPrincipal = document.getElementById("btPrincipal");
  var btDesfazer = document.getElementById("btDesfazer");
  var btMenu = document.getElementById("btMenu");
  var folha = document.getElementById("folha");
  var folhaCorpo = document.getElementById("folhaCorpo");

  var estado = carregar() || inicial();
  var pulsar = {};
  var historicoAberto = false;
  var ultimaRodadaSalva = 0;
  var aguardandoConfirmacao = null;

  /* ---------------- estado ---------------- */

  function id() {
    return "j" + Math.random().toString(36).slice(2, 9);
  }

  function jogador(nome) {
    return { id: id(), nome: nome, pontos: 0, fora: false, desistiu: false };
  }

  function inicial() {
    return {
      fase: "config",
      regras: { inicial: 10, naoFoi: 1, ganhou: 0, foiPerdeu: 2 },
      jogadores: [jogador("Jogador 1"), jogador("Jogador 2"), jogador("Jogador 3")],
      rodadas: [],
      vao: {}
    };
  }

  function salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* modo privado */ }
  }

  function carregar() {
    try {
      var bruto = localStorage.getItem(CHAVE);
      if (!bruto) return null;
      var lido = JSON.parse(bruto);
      if (!lido || !Array.isArray(lido.jogadores) || !lido.regras) return null;
      // jogo salvo pelo formato antigo (três botões por jogador) vira "quem vai"
      if (!lido.vao) {
        lido.vao = {};
        if (lido.jogada) {
          Object.keys(lido.jogada).forEach(function (idJogador) {
            if (lido.jogada[idJogador] !== "naoFoi") lido.vao[idJogador] = true;
          });
        }
      }
      delete lido.jogada;
      lido.jogadores.forEach(function (j) {
        if (typeof j.desistiu !== "boolean") j.desistiu = false;
      });
      return lido;
    } catch (e) { return null; }
  }

  function ativos() {
    return estado.jogadores.filter(function (j) { return !j.fora && !j.desistiu; });
  }

  function quemVai() {
    return ativos().filter(function (j) { return estado.vao[j.id]; });
  }

  function campeao() {
    if (estado.fase !== "jogo" || !estado.rodadas.length) return null;
    var vivos = ativos();
    if (vivos.length === 1) return [vivos[0]];
    if (vivos.length === 0) {
      var candidatos = estado.jogadores.filter(function (j) { return !j.desistiu; });
      if (!candidatos.length) return null;
      var topo = Math.max.apply(null, candidatos.map(function (j) { return j.pontos; }));
      return candidatos.filter(function (j) { return j.pontos === topo; });
    }
    return null;
  }

  function esc(texto) {
    return String(texto).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function sinal(n) {
    return n > 0 ? "−" + n : String(n);
  }

  /* ---------------- tela de configuração ---------------- */

  function verConfig() {
    var html = '<div class="bloco">' +
      '<div class="rotulo">Jogadores</div>' +
      '<div id="nomes">' +
      estado.jogadores.map(function (j, i) {
        return '<div class="campo-nome">' +
          '<input type="text" value="' + esc(j.nome) + '" data-nome="' + j.id + '" ' +
          'placeholder="Jogador ' + (i + 1) + '" autocomplete="off" enterkeyhint="next">' +
          (estado.jogadores.length > 2
            ? '<button class="remover" data-remover="' + j.id + '" aria-label="Tirar ' + esc(j.nome) + '">−</button>'
            : "") +
          "</div>";
      }).join("") +
      "</div>" +
      (estado.jogadores.length < 12 ? '<button class="adicionar" id="btAdicionar">+ Adicionar jogador</button>' : "") +
      "</div>";

    html += '<div class="bloco">' +
      '<div class="rotulo">Pontos</div>' +
      '<p class="ajuda">Cada um começa com os pontos de entrada e vai perdendo. ' +
      'Quem chega a zero está fora; o último com pontos ganha o jogo.</p>' +
      '<div class="regra">' +
        '<p>Pontos de entrada<span>Com quanto cada um começa</span></p>' +
        '<input type="number" inputmode="numeric" min="1" max="999" value="' + estado.regras.inicial + '" data-regra="inicial">' +
      "</div>" +
      TIPOS.map(function (t) {
        return '<div class="regra">' +
          "<p>" + t.curto + "<span>" + t.longo + "</span></p>" +
          '<input type="number" inputmode="numeric" min="0" max="99" value="' + estado.regras[t.chave] + '" data-regra="' + t.chave + '">' +
          "</div>";
      }).join("") +
      "</div>";

    tela.innerHTML = html;
    rodape.hidden = false;
    btPrincipal.textContent = "Começar jogo";
    btPrincipal.disabled = false;
    btDesfazer.hidden = true;
    btMenu.hidden = true;
  }

  /* ---------------- tela de jogo ---------------- */

  function verJogo() {
    var vencedores = campeao();
    var numero = estado.rodadas.length + 1;
    var naipe = NAIPES[(numero - 1) % 4];
    var html = "";

    if (vencedores) {
      html += '<div class="campeao">' +
        "<b>" + esc(vencedores.map(function (j) { return j.nome; }).join(" e ")) + "</b>" +
        "<span>" + (vencedores.length > 1 ? "empataram no fim das contas" : "venceu depois de " + estado.rodadas.length + " rodada" + (estado.rodadas.length > 1 ? "s" : "")) + "</span>" +
        "</div>";
    } else {
      html += '<div class="selo">' +
        '<div class="naipe' + (naipe === NAIPES[1] || naipe === NAIPES[2] ? " vermelho" : "") + '">' + naipe + "</div>" +
        "<div>Rodada " + numero + "<em>Marque quem vai nesta rodada</em></div>" +
        "</div>";
    }

    html += '<div class="lista">' + estado.jogadores.map(function (j) {
      var venceu = vencedores && vencedores.indexOf(j) !== -1;
      var linha = '<div class="carta' + (j.fora ? " fora" : "") + (j.desistiu ? " saiu" : "") +
        (venceu ? " campea" : "") + '">' +
        '<div class="cabeca">' +
          '<div class="quem"><div class="nome">' + esc(j.nome) + "</div>" +
          (j.fora ? '<span class="etiqueta fora">Fora</span>' : "") +
          (j.desistiu ? '<span class="etiqueta saiu">Desistiu</span>' : "") +
          (venceu ? '<span class="etiqueta campea">Campeão</span>' : "") +
          "</div>" +
          '<div class="pontos' + (pulsar[j.id] ? " mudou" : "") + '">' + j.pontos +
            "<small>pontos</small></div>" +
        "</div>";

      if (!j.fora && !j.desistiu && !vencedores) {
        var vai = !!estado.vao[j.id];
        linha += '<button class="vai" aria-pressed="' + vai + '" data-vai="' + j.id + '">' +
          (vai ? "Vai" : "Não vai") +
          "<small>" + (vai
            ? sinal(estado.regras.ganhou) + " se ganhar · " + sinal(estado.regras.foiPerdeu) + " se perder"
            : sinal(estado.regras.naoFoi) + " de qualquer jeito") +
          "</small></button>";
      }

      return linha + "</div>";
    }).join("") + "</div>";

    if (estado.rodadas.length) {
      html += '<details class="historico"' + (historicoAberto ? " open" : "") +
        "><summary>Histórico · " + estado.rodadas.length + " rodada" +
        (estado.rodadas.length > 1 ? "s" : "") + "</summary>" +
        estado.rodadas.slice().reverse().map(function (r) {
          return '<div class="rodada"><b>' + r.numero + "</b><div>" +
            estado.jogadores.filter(function (j) { return r.deltas[j.id] !== undefined; }).map(function (j) {
              var d = r.deltas[j.id];
              return "<span>" + esc(j.nome) + " <i class=\"" + (d > 0 ? "perda" : "zero") + "\">" + sinal(d) + "</i></span>";
            }).join("") +
            "</div></div>";
        }).join("") + "</details>";
    }

    tela.innerHTML = html;
    pulsar = {};

    var detalhes = tela.querySelector(".historico");
    if (detalhes) {
      detalhes.addEventListener("toggle", function () { historicoAberto = detalhes.open; });
    }

    rodape.hidden = false;
    btPrincipal.textContent = vencedores
      ? "Jogar de novo"
      : (quemVai().length ? "Quem ganhou?" : "Ninguém foi — salvar rodada");
    btPrincipal.disabled = false;
    btDesfazer.hidden = false;
    btDesfazer.disabled = !estado.rodadas.length;
    btMenu.hidden = false;
  }

  function ver() {
    if (estado.fase === "config") verConfig(); else verJogo();
    salvar();
  }

  /* ---------------- ações ---------------- */

  function lerConfig() {
    Array.prototype.forEach.call(tela.querySelectorAll("[data-nome]"), function (campo) {
      var j = acharJogador(campo.getAttribute("data-nome"));
      if (j) j.nome = campo.value.trim() || j.nome;
    });
    Array.prototype.forEach.call(tela.querySelectorAll("[data-regra]"), function (campo) {
      var chave = campo.getAttribute("data-regra");
      var valor = parseInt(campo.value, 10);
      if (isNaN(valor) || valor < 0) return; // campo em branco mantém o valor que já vale
      estado.regras[chave] = chave === "inicial" ? Math.max(1, Math.min(999, valor)) : Math.min(99, valor);
    });
  }

  function acharJogador(idJogador) {
    for (var i = 0; i < estado.jogadores.length; i++) {
      if (estado.jogadores[i].id === idJogador) return estado.jogadores[i];
    }
    return null;
  }

  function comecar() {
    lerConfig();
    estado.jogadores.forEach(function (j, i) {
      j.nome = j.nome || "Jogador " + (i + 1);
      j.pontos = estado.regras.inicial;
      j.fora = false;
      j.desistiu = false;
    });
    estado.rodadas = [];
    estado.vao = {};
    estado.fase = "jogo";
    ver();
  }

  function salvarRodada(ganhador) {
    ultimaRodadaSalva = Date.now();

    var deltas = {};
    var pontosAntes = {};
    var foraAgora = [];

    ativos().forEach(function (j) {
      var perda;
      if (!estado.vao[j.id]) perda = estado.regras.naoFoi;
      else if (j.id === ganhador) perda = estado.regras.ganhou;
      else perda = estado.regras.foiPerdeu;
      deltas[j.id] = perda;
      pontosAntes[j.id] = j.pontos;
      if (perda) pulsar[j.id] = true;
      j.pontos = j.pontos - perda;
      if (j.pontos <= 0) {
        j.pontos = 0;
        j.fora = true;
        foraAgora.push(j.id);
      }
    });

    estado.rodadas.push({
      numero: estado.rodadas.length + 1,
      deltas: deltas,
      pontosAntes: pontosAntes,
      foraAgora: foraAgora,
      vao: estado.vao,
      ganhador: ganhador || null
    });
    estado.vao = {};
    ver();
  }

  function desfazer() {
    var ultima = estado.rodadas.pop();
    if (!ultima) return;
    estado.jogadores.forEach(function (j) {
      if (ultima.pontosAntes[j.id] === undefined) return;
      j.pontos = ultima.pontosAntes[j.id];
      if (ultima.foraAgora.indexOf(j.id) !== -1) j.fora = false;
    });
    estado.vao = ultima.vao || {};
    ver();
  }

  /* ---------------- folha de opções ---------------- */

  function abrirFolha(html) {
    folhaCorpo.innerHTML = html;
    folha.hidden = false;
  }

  function fecharFolha() {
    folha.hidden = true;
  }

  function menu() {
    abrirFolha(
      '<div class="rotulo">Opções</div>' +
      '<button class="opcao" data-acao="incluir">Incluir jogador agora</button>' +
      '<button class="opcao" data-acao="desistir">Tirar jogador que desistiu</button>' +
      '<button class="opcao" data-acao="ajustar">Ajustar pontos à mão</button>' +
      '<button class="opcao" data-acao="regras">Ver e mudar as regras</button>' +
      '<button class="opcao" data-acao="reiniciar">Zerar placar com os mesmos jogadores</button>' +
      '<button class="opcao perigo" data-acao="novo">Novo jogo (mudar jogadores)</button>' +
      '<button class="opcao" data-acao="fechar">Fechar</button>'
    );
  }

  function painelAjuste() {
    abrirFolha(
      '<div class="rotulo">Ajustar pontos</div>' +
      '<p class="ajuda">Para corrigir um erro na hora. A correção não entra no histórico.</p>' +
      estado.jogadores.map(function (j) {
        return '<div class="ajuste">' +
          "<span>" + esc(j.nome) + "</span>" +
          '<button class="passo" data-ajuste="' + j.id + '" data-passo="-1" aria-label="Tirar 1 ponto de ' + esc(j.nome) + '">−</button>' +
          "<b>" + j.pontos + "</b>" +
          '<button class="passo" data-ajuste="' + j.id + '" data-passo="1" aria-label="Dar 1 ponto a ' + esc(j.nome) + '">+</button>' +
          "</div>";
      }).join("") +
      '<button class="opcao" data-acao="fechar">Pronto</button>'
    );
  }

  function mediaDaMesa() {
    var vivos = ativos();
    if (!vivos.length) return estado.regras.inicial;
    var soma = vivos.reduce(function (s, j) { return s + j.pontos; }, 0);
    return Math.max(1, Math.round(soma / vivos.length));
  }

  function painelIncluir() {
    abrirFolha(
      '<div class="rotulo">Incluir jogador</div>' +
      '<p class="ajuda">Quem chega no meio entra valendo a média de quem está jogando. ' +
      "Pode trocar o número se a mesa combinar outra coisa.</p>" +
      '<div class="campo-nome"><input type="text" id="novoNome" placeholder="Nome" autocomplete="off"></div>' +
      '<div class="regra">' +
        "<p>Começa com<span>Média da mesa agora</span></p>" +
        '<input type="number" inputmode="numeric" min="1" max="999" id="novoPontos" value="' + mediaDaMesa() + '">' +
      "</div>" +
      '<button class="opcao" data-acao="confirmarInclusao">Incluir no jogo</button>' +
      '<button class="opcao" data-acao="fechar">Cancelar</button>'
    );
  }

  function painelGanhador() {
    abrirFolha(
      '<div class="rotulo">Quem ganhou</div>' +
      '<p class="ajuda">Toque em quem levou a rodada — só quem foi aparece aqui. ' +
      "Escolher o ganhador já salva a rodada.</p>" +
      quemVai().map(function (j) {
        return '<button class="opcao" data-ganhador="' + j.id + '">' + esc(j.nome) + "</button>";
      }).join("") +
      '<button class="opcao" data-acao="fechar">Cancelar</button>'
    );
  }

  function painelDesistir() {
    var vivos = ativos();
    abrirFolha(
      '<div class="rotulo">Tirar quem desistiu</div>' +
      '<p class="ajuda">Quem sai não entra nas próximas rodadas e não disputa o campeonato. ' +
      "As rodadas que ele já jogou continuam no histórico.</p>" +
      (vivos.length
        ? vivos.map(function (j) {
            return '<button class="opcao" data-desistiu="' + j.id + '">' + esc(j.nome) + "</button>";
          }).join("")
        : '<p class="ajuda">Não há ninguém em jogo.</p>') +
      '<button class="opcao" data-acao="fechar">Cancelar</button>'
    );
  }

  function painelConfirma(texto, rotulo, aoConfirmar) {
    aguardandoConfirmacao = aoConfirmar;
    abrirFolha(
      '<div class="rotulo">Confirmar</div>' +
      '<p class="ajuda">' + texto + "</p>" +
      '<button class="opcao perigo" data-acao="confirmado">' + rotulo + "</button>" +
      '<button class="opcao" data-acao="fechar">Cancelar</button>'
    );
  }

  function painelRegras() {
    abrirFolha(
      '<div class="rotulo">Regras</div>' +
      '<p class="ajuda">Vale das próximas rodadas em diante.</p>' +
      TIPOS.map(function (t) {
        return '<div class="regra">' +
          "<p>" + t.curto + "<span>" + t.longo + "</span></p>" +
          '<input type="number" inputmode="numeric" min="0" max="99" value="' + estado.regras[t.chave] + '" data-regra-viva="' + t.chave + '">' +
          "</div>";
      }).join("") +
      '<button class="opcao" data-acao="fechar">Pronto</button>'
    );
  }

  /* ---------------- eventos ---------------- */

  tela.addEventListener("click", function (ev) {
    var alvo = ev.target.closest("[data-vai], [data-remover], #btAdicionar");
    if (!alvo) return;

    if (alvo.hasAttribute("data-vai")) {
      var quem = alvo.getAttribute("data-vai");
      if (estado.vao[quem]) delete estado.vao[quem]; else estado.vao[quem] = true;
      ver();
    } else if (alvo.hasAttribute("data-remover")) {
      lerConfig();
      var alvoId = alvo.getAttribute("data-remover");
      estado.jogadores = estado.jogadores.filter(function (j) { return j.id !== alvoId; });
      ver();
    } else {
      lerConfig();
      estado.jogadores.push(jogador("Jogador " + (estado.jogadores.length + 1)));
      ver();
      var campos = tela.querySelectorAll("[data-nome]");
      if (campos.length) campos[campos.length - 1].focus();
    }
  });

  btPrincipal.addEventListener("click", function () {
    if (estado.fase === "config") return comecar();
    if (campeao()) return comecar();
    // rodada em que alguém foi não fecha sem ganhador
    if (quemVai().length) return painelGanhador();
    // a trava de toque duplo vale só aqui: escolher o ganhador no painel já exige
    // dois toques de propósito, e travá-lo prenderia o painel aberto sem explicação
    if (Date.now() - ultimaRodadaSalva < 700) return;
    salvarRodada(null);
  });

  btDesfazer.addEventListener("click", desfazer);
  btMenu.addEventListener("click", menu);

  folha.addEventListener("click", function (ev) {
    if (ev.target === folha) {
      aguardandoConfirmacao = null;
      fecharFolha();
      ver();
      return;
    }

    var escolhido = ev.target.closest("[data-ganhador]");
    if (escolhido) {
      fecharFolha();
      salvarRodada(escolhido.getAttribute("data-ganhador"));
      return;
    }

    var saiu = ev.target.closest("[data-desistiu]");
    if (saiu) {
      var quemSai = acharJogador(saiu.getAttribute("data-desistiu"));
      if (quemSai) {
        painelConfirma(esc(quemSai.nome) + " sai do jogo agora. As rodadas que já jogou continuam no histórico.",
          "Tirar do jogo", function () {
            quemSai.desistiu = true;
            delete estado.vao[quemSai.id];
            ver();
          });
      }
      return;
    }

    var passo = ev.target.closest("[data-ajuste]");
    if (passo) {
      var j = acharJogador(passo.getAttribute("data-ajuste"));
      if (j) {
        j.pontos = Math.max(0, j.pontos + parseInt(passo.getAttribute("data-passo"), 10));
        j.fora = j.pontos <= 0;
      }
      salvar();
      painelAjuste();
      ver();
      return;
    }

    var acao = ev.target.closest("[data-acao]");
    if (!acao) return;
    var qual = acao.getAttribute("data-acao");

    if (qual === "fechar") {
      aguardandoConfirmacao = null;
      fecharFolha();
      ver();
    } else if (qual === "confirmado") {
      var acaoPendente = aguardandoConfirmacao;
      aguardandoConfirmacao = null;
      fecharFolha();
      if (acaoPendente) acaoPendente();
    } else if (qual === "ajustar") {
      painelAjuste();
    } else if (qual === "regras") {
      painelRegras();
    } else if (qual === "incluir") {
      painelIncluir();
    } else if (qual === "desistir") {
      painelDesistir();
    } else if (qual === "confirmarInclusao") {
      var campoNome = document.getElementById("novoNome");
      var campoPontos = document.getElementById("novoPontos");
      var quantos = parseInt(campoPontos ? campoPontos.value : "", 10);
      if (isNaN(quantos) || quantos < 1) quantos = mediaDaMesa();
      var nome = campoNome ? campoNome.value.trim() : "";
      var novo = jogador(nome || "Jogador " + (estado.jogadores.length + 1));
      novo.pontos = Math.min(999, quantos);
      estado.jogadores.push(novo);
      fecharFolha();
      ver();
    } else if (qual === "reiniciar") {
      painelConfirma("Os pontos voltam ao início e o histórico some. Os jogadores continuam os mesmos.",
        "Zerar placar", comecar);
    } else if (qual === "novo") {
      painelConfirma("O placar atual será apagado e você volta para a tela de jogadores.",
        "Começar jogo novo", function () {
          estado.fase = "config";
          estado.rodadas = [];
          estado.vao = {};
          historicoAberto = false;
          ver();
        });
    }
  });

  // regra alterada vale na hora: fechar o painel de qualquer jeito não perde a mudança
  folha.addEventListener("input", function (ev) {
    var campo = ev.target.closest("[data-regra-viva]");
    if (!campo) return;
    var valor = parseInt(campo.value, 10);
    if (isNaN(valor) || valor < 0) return; // campo em branco mantém o valor que já vale
    estado.regras[campo.getAttribute("data-regra-viva")] = Math.min(99, valor);
    salvar();
  });

  ver();
})();
</script>
</body>
</html>
